<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a537a"><title>Maloé Gestion — Démonstration</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#12334a;background:#f3f8fb}*{box-sizing:border-box}body{margin:0}header{background:#0a537a;color:white;padding:22px 18px 18px}header .top{display:flex;align-items:center;gap:12px;max-width:650px;margin:auto}header img{width:60px;height:60px;object-fit:contain}h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:#d5edf7;font-size:13px}.demo{background:#fff0ca;color:#684b00;text-align:center;padding:10px;font-weight:650;font-size:13px}main{max-width:650px;margin:auto;padding:18px 16px 105px}h2{font-size:20px;margin:6px 0 16px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.panel{background:white;border:1px solid #e0eaf0;border-radius:16px;padding:17px;box-shadow:0 2px 10px #15334b08}.card small{display:block;color:#607b8a;font-size:12px;margin-top:9px}.card strong{font-size:27px}.panel{margin-top:16px}.panel h3{margin:0 0 14px;font-size:16px}.item{padding:13px 0;border-top:1px solid #e9eff3;display:flex;justify-content:space-between;gap:10px}.item:first-of-type{border-top:0}.item span{color:#557486;font-size:13px}.pill{border-radius:99px;padding:5px 9px;background:#e3f2fb;color:#07547b;font-size:12px;white-space:nowrap;align-self:center}.muted{color:#637d8c;font-size:14px;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce8ee;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;max-width:130px;border:0;background:transparent;padding:12px 2px 10px;color:#5b7482;font-size:11px;cursor:pointer}.nav button[aria-current=page]{color:#07547b;font-weight:750;background:#e9f5fb}.nav b{display:block;font-size:22px;margin-bottom:3px}.notice{border-left:4px solid #0b6b9d;background:#e8f4fb;padding:12px;border-radius:8px;font-size:13px;line-height:1.5}button:focus-visible{outline:3px solid #f1b743;outline-offset:-3px}
</style></head><body>
<header><div class="top"><img src="../images/logo-hero.webp" alt=""><div><h1>Maloé Gestion</h1><p>Votre espace de gestion · Version 1</p></div></div></header>
<div class="demo">MODE DÉMONSTRATION — aucune donnée réelle ni connexion administrateur</div>
<main id="view" aria-live="polite"></main>
<nav class="nav" aria-label="Navigation de l'application">
<button type="button" data-page="accueil" aria-current="page"><b>⌂</b>Accueil</button>
<button type="button" data-page="planning"><b>▦</b>Planning</button>
<button type="button" data-page="locations"><b>✓</b>Locations</button>
<button type="button" data-page="stock"><b>▣</b>Stock</button>
<button type="button" data-page="plus"><b>☰</b>Plus</button>
</nav>
<script>
const screens={
accueil:`<h2>Tableau de bord</h2><div class="cards"><div class="card"><strong>3</strong><small>Réservations du jour</small></div><div class="card"><strong>2</strong><small>Départs prévus</small></div><div class="card"><strong>1</strong><small>Retours prévus</small></div><div class="card"><strong>425 €</strong><small>CA du mois</small></div></div><section class="panel"><h3>Prochaines opérations</h3><div class="item"><div><b>09:00 · Départ PMT</b><br><span>Client fictif A</span></div><span class="pill">Départ</span></div><div class="item"><div><b>17:00 · Retour parasol</b><br><span>Client fictif B</span></div><span class="pill">Retour</span></div></section>`,
planning:`<h2>Planning</h2><div class="notice">Le calendrier sera relié aux réservations Supabase après validation de la connexion sécurisée.</div><section class="panel"><h3>Exemples d'opérations</h3><div class="item"><b>09:00 · PMT</b><span>Départ fictif</span></div><div class="item"><b>17:00 · Parasol</b><span>Retour fictif</span></div></section>`,
locations:`<h2>Locations</h2><div class="notice">Les réservations, paiements, états des lieux et documents seront accessibles ici après connexion au serveur.</div><section class="panel"><h3>Parcours prévu</h3><div class="item">Réservation <span>→</span></div><div class="item">Départ et photos <span>→</span></div><div class="item">Retour et PDF <span>→</span></div></section>`,
stock:`<h2>Stock et matériel</h2><div class="notice">La disponibilité devra respecter les stocks réels et le délai de 45 minutes entre retour et nouveau départ.</div><section class="panel"><h3>Familles de matériel</h3><div class="item">Palmes et masques <span>À connecter</span></div><div class="item">Glacières et parasols <span>À connecter</span></div><div class="item">Caméras et packs <span>À connecter</span></div></section>`,
plus:`<h2>Autres fonctions</h2><section class="panel"><h3>Fonctions à développer</h3><div class="item">Statistiques <span>À venir</span></div><div class="item">Factures <span>À venir</span></div><div class="item">Notifications <span>À venir</span></div><div class="item">Paramètres administrateur <span>À venir</span></div></section><p class="muted">Aucune donnée client ni clé secrète n'est enregistrée dans cette démonstration.</p>`
};
function show(page){if(!Object.hasOwn(screens,page))return;document.getElementById('view').innerHTML=screens[page];document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));show('accueil');
</script></body></html>
