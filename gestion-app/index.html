const screens={
accueil:`<h2>Tableau de bord</h2><div class="cards"><div class="card"><strong>3</strong><small>Réservations du jour</small></div><div class="card"><strong>2</strong><small>Départs prévus</small></div><div class="card"><strong>1</strong><small>Retours prévus</small></div><div class="card"><strong>425 €</strong><small>CA du mois</small></div></div><section class="panel"><h3>Prochaines opérations</h3><div class="item"><div><b>09:00 · Départ PMT</b><br><span>Client fictif A</span></div><span class="pill">Départ</span></div><div class="item"><div><b>17:00 · Retour parasol</b><br><span>Client fictif B</span></div><span class="pill">Retour</span></div></section>`,
planning:`<h2>Planning</h2><div class="notice">Le calendrier sera relié aux réservations Supabase après validation de la connexion sécurisée.</div><section class="panel"><h3>Exemples d'opérations</h3><div class="item"><b>09:00 · PMT</b><span>Départ fictif</span></div><div class="item"><b>17:00 · Parasol</b><span>Retour fictif</span></div></section>`,
locations:`<h2>Locations</h2><div class="notice">Les réservations, paiements, états des lieux et documents seront accessibles ici après connexion au serveur.</div><section class="panel"><h3>Parcours prévu</h3><div class="item">Réservation <span>→</span></div><div class="item">Départ et photos <span>→</span></div><div class="item">Retour et PDF <span>→</span></div></section>`,
stock:`<h2>Stock et matériel</h2><div class="notice">La disponibilité devra respecter les stocks réels et le délai de 45 minutes entre retour et nouveau départ.</div><section class="panel"><h3>Familles de matériel</h3><div class="item">Palmes et masques <span>À connecter</span></div><div class="item">Glacières et parasols <span>À connecter</span></div><div class="item">Caméras et packs <span>À connecter</span></div></section>`,
plus:`<h2>Autres fonctions</h2><section class="panel"><h3>Fonctions à développer</h3><div class="item">Statistiques <span>À venir</span></div><div class="item">Factures <span>À venir</span></div><div class="item">Notifications <span>Activation</span></div><div style="padding:12px 0"><p class="muted">Alertes souhaitées : demandes de livraison, nouvelles réservations payées, annulations et retours prévus. Les e-mails de réservation sont déjà configurés. Active ton téléphone pour recevoir les notifications automatiques en arrière-plan.</p><button type="button" onclick="window.maloeSubscribePush()" style="padding:12px;border:0;border-radius:10px;background:#0a537a;color:white;font-weight:700;margin-bottom:8px">Activer les alertes automatiques</button><button type="button" onclick="window.maloeTestNotification()" style="padding:12px;border:0;border-radius:10px;background:#0a537a;color:white;font-weight:700">Autoriser et tester les notifications Android</button><p id="maloe-notif-status" role="status" class="muted"></p></div><div class="item">Paramètres administrateur <span>À venir</span></div></section><p class="muted">Accès réservé à l'administration de Maloé Location.</p>`
};
async function maloeTestNotification(){
 const msg=document.getElementById('maloe-notif-status');
 const say=t=>{if(msg)msg.textContent=t};
 if(!('Notification' in window)||!('serviceWorker' in navigator)){say('Notifications non prises en charge par ce navigateur.');return}
 try{
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){say('Notifications non autorisées. Vérifie les paramètres Android de Maloé Gestion.');return}
  const registration=await appNotificationRegistration();
  await registration.showNotification('Maloé Gestion — Notification de test',{body:'Les notifications sont autorisées sur cet appareil. Aucun client ni paiement réel.',icon:'../images/logo-hero.webp',badge:'../images/logo-hero.webp',tag:'maloe-notification-test',data:{url:'./lancer'}});
  say('Notification de test envoyée à Android. Les alertes automatiques nécessitent encore la connexion au serveur.');
 }catch(e){say('Test impossible : '+(e?.message||'erreur inconnue'))}
}
window.maloeTestNotification=maloeTestNotification;
function show(page){if(!Object.hasOwn(screens,page))return;document.getElementById('dashboard-screen').innerHTML=screens[page];document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{window.maloeSelectedReservation=null;show(b.dataset.page);if(b.dataset.page==='accueil'&&window.refreshMaloeDashboard)window.refreshMaloeDashboard();if(b.dataset.page==='planning'&&window.refreshMaloePlanning)window.refreshMaloePlanning();if(b.dataset.page==='locations'&&window.refreshMaloeLocations)window.refreshMaloeLocations();if(b.dataset.page==='stock'&&window.refreshMaloeStock)window.refreshMaloeStock()}));show('accueil');

async function appNotificationRegistration(){
 const appUrl=new URL(document.baseURI);
 if(window.location.pathname.startsWith(appUrl.pathname))return navigator.serviceWorker.ready;
 const registration=await navigator.serviceWorker.getRegistration(appUrl.href);
 if(!registration?.active)throw new Error('Les notifications sont en cours d’initialisation. Réessaie dans quelques secondes.');
 return registration;
}
async function checkAppVersion(){
 const current=document.getElementById('app-version').textContent.trim();
 try{
  const response=await fetch('./version.json',{cache:'no-store'});
  if(!response.ok)return;
  const {version}=await response.json();
  if(typeof version!=='string'||!/^\d+(\.\d+)+$/.test(version)||version===current)return;
  const url=new URL(window.location.href);
  url.searchParams.set('v',version);
  document.getElementById('app-update-link').href=url.href;
  document.getElementById('app-update').hidden=false;
 }catch{
  // The update can be checked again when the app returns to the foreground.
 }
}
window.addEventListener('pageshow',checkAppVersion);
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible')checkAppVersion();
});
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
}
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 const panel=document.getElementById('auth-panel'),view=document.getElementById('view'),nav=document.querySelector('nav.nav'),status=document.getElementById('auth-status'),form=document.getElementById('auth-form');
 let client;
 async function subscribeMaloePush(){
  const el=document.getElementById('maloe-notif-status');
  const say=t=>{if(el)el.textContent=t};
  try{
   if(!client)throw Error('Connecte-toi avant de continuer.');
   const {data:user,error:authError}=await client.auth.getUser();
   if(authError||!user.user)throw Error('Session expirée.');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');
   if(permissionError||allowed!==true)throw Error('Accès administrateur requis.');
   if(!('PushManager' in window)||!('serviceWorker' in navigator))throw Error('Notifications push non prises en charge.');
   if(await Notification.requestPermission()!=='granted')throw Error('Autorisation Android refusée.');
   const registration=await appNotificationRegistration();
   const key='BEIpS9MQXtopL62RYYE-gLnBBBh4kRTCfhaljbg-j2ZIX29lWPtPbTxtEkimfpfAHJZC1NHp4BK2fCJzxcyaGLc';
   const b64=key.replace(/-/g,'+').replace(/_/g,'/');
   const bytes=Uint8Array.from(atob(b64+'='.repeat((4-b64.length%4)%4)),c=>c.charCodeAt(0));
   let sub=await registration.pushManager.getSubscription();
   if(sub){const existing=new Uint8Array(sub.options.applicationServerKey||[]);if(existing.length!==bytes.length||existing.some((v,i)=>v!==bytes[i])){await sub.unsubscribe();sub=null}}
   if(!sub)sub=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});
   const json=sub.toJSON();
   const {error}=await client.from('admin_push_subscriptions').upsert({user_id:user.user.id,endpoint:sub.endpoint,p256dh:json.keys.p256dh,auth_secret:json.keys.auth,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
   if(error)throw error;
   say('Téléphone inscrit aux notifications automatiques. Tu peux fermer Maloé Gestion.');
  }catch(e){say('Activation impossible : '+(e?.message||'erreur inconnue'))}
 }
 window.maloeSubscribePush=subscribeMaloePush;
 const edlDialog=document.getElementById('edl-dialog');
 const edlFrame=document.getElementById('edl-frame');

 function closeEdl(){
  if(!edlDialog.open)return;
  edlDialog.close();
  edlFrame.removeAttribute('src');
 }
 function returnFromEdl(){
  if(edlFrame.contentWindow?.maloeEdlCanClose?.()===false)return;
  const reservationId=edlDialog.dataset.reservation;
  closeEdl();
  loadLocations({background:true,reservationId});
 }
 document.getElementById('edl-back').addEventListener('click',returnFromEdl);
 edlDialog.addEventListener('cancel',event=>{
  event.preventDefault();
  returnFromEdl();
 });
 function openEdl(reservationId,stage){
  const url=new URL('/etat-des-lieux',window.location.origin);
  url.search=new URLSearchParams({app:'1',reservation_id:reservationId,etape:stage,v:document.getElementById('app-version').textContent.trim()});
  edlDialog.dataset.reservation=reservationId;
  edlFrame.src=url.href;
  edlDialog.showModal();
 }

 function lock(message=''){closeEdl();window.maloePlanningTicket=(window.maloePlanningTicket||0)+1;window.maloeDashboardTicket=(window.maloeDashboardTicket||0)+1;view.hidden=true;nav.hidden=true;panel.hidden=false;document.getElementById('auth-password').value='';status.textContent=message;}
 function unlock(){panel.hidden=true;view.hidden=false;nav.hidden=false;if(!document.getElementById('logout')){const b=document.createElement('button');b.id='logout';b.className='logout';b.textContent='Se déconnecter';view.prepend(b);b.addEventListener('click',async()=>{lock();try{await client.auth.signOut()}catch{lock('Déconnexion non confirmée. Réessaie.')}})}}
 async function verify(){const {data,error}=await client.auth.getUser();if(error||!data.user){lock();return}const {data:allowed,error:permissionError}=await client.rpc('is_admin');if(permissionError||allowed!==true){lock('Ce compte ne possède pas les droits administrateur.');return}unlock();if(new URLSearchParams(location.search).get('vue')==='livraisons'){show('locations');await loadDeliveryRequests()}else await loadDashboard()}

 async function loadDashboard(){
  const ticket=window.maloeDashboardTicket=(window.maloeDashboardTicket||0)+1;
  const screen=document.getElementById('dashboard-screen');
  if(!screen||view.hidden)return;
  screen.innerHTML='<h2>Tableau de bord</h2><p class="muted">Chargement des réservations…</p>';
  try{
   const {data:who,error:authError}=await client.auth.getUser();
   if(authError||!who.user)throw Error('Session expirée');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');
   if(permissionError||allowed!==true)throw Error('Accès administrateur refusé');
   const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Indian/Reunion',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
   const month=today.slice(0,7);
   const end=new Date(Date.parse(month+'-01T00:00:00Z'));end.setUTCMonth(end.getUTCMonth()+1);
   const endMonth=new Date(end.getTime()-86400000).toISOString().slice(0,10);
   async function all(make){const out=[];for(let i=0;i<10000;i+=500){const {data,error}=await make().range(i,i+499);if(error)throw error;out.push(...data);if(data.length<500)return out}throw Error('Trop de réservations pour ce tableau de bord')}
   const [daily,monthly]=await Promise.all([
    all(()=>client.from('reservations').select('id,date_retrait,date_retour,heure_retrait,heure_retour,statut,expires_at,retour_effectif_at,paiement_confirme_at,mode_test,stancer_payment_status,etats_des_lieux(type)').lte('date_retrait',today).gte('date_retour',today)),
    all(()=>client.from('reservations').select('id,total,date_retrait,statut,paiement_confirme_at,mode_test,stancer_payment_status').gte('date_retrait',month+'-01').lte('date_retrait',endMonth))
   ]);
   if(ticket!==window.maloeDashboardTicket||view.hidden)return;
   const active=r=>{const s=(r.statut||'').toLowerCase();return !/annul|cancel|refus|expir/.test(s)&&!(s==='en_attente_paiement'&&(!r.expires_at||Date.parse(r.expires_at)<=Date.now()))};
   const valid=daily.filter(r=>!r.mode_test&&active(r));
   const departs=valid.filter(r=>r.date_retrait===today&&!r.retour_effectif_at).length;
   const retours=valid.filter(r=>r.date_retour===today&&!r.retour_effectif_at).length;
   const enCours=valid.filter(r=>r.date_retrait<=today&&r.date_retour>=today&&(r.statut==='en_cours'||(r.etats_des_lieux||[]).some(x=>x.type==='depart'))&&!r.retour_effectif_at).length;
   const paid=monthly.filter(r=>!r.mode_test&&active(r)&&!!r.paiement_confirme_at);
   const revenue=paid.reduce((sum,r)=>sum+(Number(r.total)||0),0);
   const euro=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(revenue);
   const safe=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
   const ops=valid.filter(r=>r.date_retrait===today||r.date_retour===today).sort((a,b)=>(a.heure_retrait||'').localeCompare(b.heure_retrait||'')).slice(0,12);
   screen.innerHTML='<h2>Tableau de bord · '+safe(today.split('-').reverse().join('/'))+'</h2><div class="cards"><div class="card"><strong>'+valid.length+'</strong><small>Locations prévues aujourd’hui</small></div><div class="card"><strong>'+departs+'</strong><small>Départs prévus</small></div><div class="card"><strong>'+retours+'</strong><small>Retours prévus</small></div><div class="card"><strong>'+enCours+'</strong><small>Locations en cours (estimées)</small></div></div><section class="panel"><h3>Réservations payées · mois en cours</h3><strong>'+safe(euro)+'</strong><p class="muted">Total des réservations confirmées payées, classées par date de retrait. Hors tests et remboursements éventuels.</p></section><section class="panel"><h3>Opérations du jour</h3>'+(ops.length?ops.map(r=>'<div class="item"><b>'+safe(r.date_retrait===today?'Départ '+(r.heure_retrait||''):'Retour '+(r.heure_retour||''))+'</b><span>Réservation '+safe(String(r.id).slice(0,8))+'</span></div>').join(''):'<p class="muted">Aucune opération prévue aujourd’hui.</p>')+'</section><p class="muted">Lecture seule · actualisation à chaque ouverture de l’accueil. Les réservations de test sont exclues.</p>';
  }catch(error){if(ticket!==window.maloeDashboardTicket||view.hidden)return;screen.innerHTML='<h2>Tableau de bord</h2><div class="notice">Impossible de charger les réservations. Aucune donnée fictive n’est affichée. Vérifie ta connexion et réessaie.</div><button id="retry-dashboard" class="logout">Réessayer</button>';document.getElementById('retry-dashboard').onclick=loadDashboard;}
 }
 window.refreshMaloeDashboard=loadDashboard;


 let planningAnchor=new Intl.DateTimeFormat('en-CA',{timeZone:'Indian/Reunion',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),planningMode='day';
 const safePlanning=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]||'&#39;'));
 function moveDay(date,amount){const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+amount);return d.toISOString().slice(0,10)}
 function dayLabel(date){return new Date(date+'T00:00:00Z').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})}
 async function loadPlanning(){
  const ticket=window.maloePlanningTicket=(window.maloePlanningTicket||0)+1;
  const screen=document.getElementById('dashboard-screen');if(view.hidden||!screen||!document.querySelector('[data-page="planning"][aria-current="page"]'))return;
  screen.innerHTML='<h2>Planning</h2><p class="muted">Chargement des locations…</p>';
  try{
   const {data:who,error:authError}=await client.auth.getUser();if(authError||!who.user)throw Error('Session expirée');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');if(permissionError||allowed!==true)throw Error('Accès administrateur refusé');
   const start=planningMode==='day'?planningAnchor:moveDay(planningAnchor,-((new Date(planningAnchor+'T00:00:00Z').getUTCDay()+6)%7));
   const end=moveDay(start,planningMode==='day'?0:6);

   .select('id,created_at,customer_name,email,phone,address,notes,delivery_date,pickup_date,delivery_time,pickup_time,items,rental_total,handled_at')
   .order('handled_at',{ascending:true,nullsFirst:true}).order('created_at',{ascending:false}).limit(100);
  if(view.hidden||!screen.contains(loading))return;
  const cards=(data||[]).map(request=>{
   const appointmentText=(date,time)=>escLocation(frenchBookingDate(date)+(time?' à '+time.slice(0,5):''));
   const items=request.items.map(item=>{
    const sizes=Object.values(item.sizes||{}).join(' · ');
    return '<li>'+escLocation(item.qty+' × '+item.name+(sizes?' · '+sizes:''))+'</li>';
   }).join('');
   const total=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(request.rental_total);
   return '<section class="panel"><h3>'+escLocation(request.customer_name)+'</h3>'+
    '<p class="muted">'+(request.handled_at?'Traitée':'À traiter')+' · Reçue le '+escLocation(new Intl.DateTimeFormat('fr-FR',{dateStyle:'short',timeStyle:'short',timeZone:'Indian/Reunion'}).format(new Date(request.created_at)))+'</p>'+
    '<p><b>Livraison souhaitée</b> '+appointmentText(request.delivery_date,request.delivery_time)+'<br>'+
    '<b>Récupération souhaitée</b> '+appointmentText(request.pickup_date,request.pickup_time)+'</p>'+
    '<p><b>Adresse</b> '+escLocation(request.address)+'</p><ul>'+items+'</ul>'+
    '<p>Location estimée à '+escLocation(total)+' · Livraison sur devis.</p>'+
    (request.notes?'<p>'+escLocation(request.notes)+'</p>':'')+
    '<p><a href="mailto:'+encodeURIComponent(request.email)+'">'+escLocation(request.email)+'</a> · <a href="tel:'+encodeURIComponent(request.phone)+'">'+escLocation(request.phone)+'</a></p>'+
    (request.handled_at?'':'<button type="button" class="logout" data-handle-delivery="'+escLocation(request.id)+'">Marquer comme traitée</button>')+'</section>';
  }).join('');
  screen.innerHTML='<h2>Demandes de livraison</h2><div><button type="button" class="logout" id="delivery-back">Retour aux locations</button> '+
   '<button type="button" class="logout" id="delivery-refresh">Actualiser</button></div><p id="delivery-app-status" role="status" class="muted"></p>'+
   (error?'<p>Impossible de charger les demandes. Réessaie.</p>':cards||'<p>Aucune demande de livraison.</p>');
  document.getElementById('delivery-back').onclick=()=>{const url=new URL(location.href);url.searchParams.delete('vue');history.replaceState(null,'',url);loadLocations()};
  document.getElementById('delivery-refresh').onclick=loadDeliveryRequests;
  const status=document.getElementById('delivery-app-status');
  screen.querySelectorAll('[data-handle-delivery]').forEach(button=>button.onclick=async()=>{
   button.disabled=true;
   const {error}=await client.from('delivery_requests').update({handled_at:new Date().toISOString()})
    .eq('id',button.dataset.handleDelivery).is('handled_at',null);
   if(!screen.contains(button)||view.hidden)return;
   if(error){status.textContent='La demande n’a pas pu être mise à jour.';button.disabled=false;return}
   loadDeliveryRequests();
  });
 }
 if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',event=>{
  if(event.data?.view==='livraisons'&&!view.hidden&&!edlDialog.open){show('locations');loadDeliveryRequests()}
 });

 function renderLocations(){
  const screen=document.getElementById('dashboard-screen');
  if(view.hidden||!document.querySelector('[data-page="locations"][aria-current="page"]'))return;
  const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Indian/Reunion',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const isCurrentOrFuture=r=>r.date_retour>=today&&!r.retour_effectif_at&&!((r.etats_des_lieux||[]).some(x=>x.type==='retour'))&&!/annul|cancel|refus|expir/.test((r.statut||'').toLowerCase())&&locationStatus(r)!=='Expirée';
  const selected=locationsData.filter(r=>locationsFilter==='toutes'||(locationsFilter==='actives'&&isCurrentOrFuture(r))||(locationsFilter==='tests'&&r.mode_test));
  const focusId=window.maloeSelectedReservation;
  const rows=(locationsFilter==='tests'?selected:selected.filter(r=>!r.mode_test||r.id===focusId)).filter(r=>!focusId||r.id===focusId).slice(0,100);
  if(window.maloeNewReservationOpen){renderNewReservationForm();return}
  screen.innerHTML='<h2>Locations</h2><button type="button" id="location-create" class="logout" style="display:block;width:100%;margin:0 0 16px">+ Nouvelle réservation</button><button type="button" class="logout" id="delivery-app-open">Demandes de livraison</button><p class="muted">Réservations en cours et à venir · lecture seule</p><div class="panel"><label for="location-filter"><b>Afficher</b></label> <select id="location-filter" style="padding:10px;max-width:100%;border:1px solid #b4c9d5;border-radius:8px"><option value="actives">En cours et à venir</option><option value="toutes">Toutes (hors tests)</option><option value="tests">Réservations de test</option></select></div>'+(rows.length?rows.map(r=>{const cl=Array.isArray(r.client)?r.client[0]:r.client;const name=[cl?.prenom,cl?.nom].filter(Boolean).join(' ')||'Client non renseigné';const gear=(r.reservation_items||[]).map(i=>String(i.quantite||1)+' × '+(Array.isArray(i.produit)?i.produit[0]?.nom:i.produit?.nom||'Matériel')).join(', ');const euro=Number.isFinite(Number(r.total))?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(r.total)):'Montant non renseigné';return '<section class="panel" '+(r.id===focusId?'data-focused-reservation="true" style="border:2px solid #0a537a"':'')+'><h3>'+escLocation(name)+'</h3><p class="muted">'+escLocation(frenchBookingDate(r.date_retrait))+' → '+escLocation(frenchBookingDate(r.date_retour))+'</p><p>'+escLocation(gear||'Matériel non renseigné')+'</p><div class="item"><b>'+escLocation(locationStatus(r))+'</b><span>'+escLocation(euro)+'</span></div>'+renderEdlProgress(r)+'<details><summary>Voir les détails</summary><p>Départ : '+appointment(r.date_retrait,r.heure_retrait)+'</p><p>Retour : '+appointment(r.date_retour,r.heure_retour)+'</p><p>Paiement : '+escLocation(r.paiement_confirme_at?'Confirmé':'Non confirmé')+'</p><p>Référence : '+escLocation(r.id)+'</p>'+(r.mode_test&&r.statut==='confirmee'&&!r.stancer_payment_intent_id?'<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="logout" data-test-action="encaisser" data-reservation="'+escLocation(r.id)+'" '+(r.paiement_confirme_at?'disabled':'')+'>Marquer encaissée (TEST)</button><button type="button" class="logout" data-test-action="annuler" data-reservation="'+escLocation(r.id)+'" '+(r.paiement_confirme_at||r.retour_effectif_at?'disabled':'')+'>Annuler (TEST)</button></div>':'')+'</details></section>'}).join(''):'<div class="panel"><p class="muted">Aucune réservation pour ce filtre.</p></div>')+'<button id="location-refresh" class="logout">Actualiser</button>';
  for(const button of screen.querySelectorAll('[data-edl-reservation]')){
   button.addEventListener('click',()=>openEdl(button.dataset.edlReservation,button.dataset.edlStage));
  }
  document.getElementById('delivery-app-open').onclick=loadDeliveryRequests;
  document.getElementById('location-create').onclick=()=>{window.maloeNewReservationOpen=true;renderNewReservationForm()};
  for(const btn of screen.querySelectorAll('[data-test-action]'))btn.onclick=async()=>{const action=btn.dataset.testAction,id=btn.dataset.reservation;if(!confirm(action==='annuler'?'Annuler cette réservation TEST et libérer le stock ?':'Marquer cette réservation TEST comme encaissée ?'))return;btn.disabled=true;try{const {error}=await client.rpc('admin_manage_test_reservation',{p_reservation_id:id,p_action:action});if(error)throw error;await loadLocations()}catch(e){alert('Action refusée : '+e.message);btn.disabled=false}};
  document.getElementById('location-filter').value=locationsFilter;
  document.getElementById('location-filter').onchange=e=>{window.maloeSelectedReservation=null;locationsFilter=e.target.value;renderLocations()};
  document.getElementById('location-refresh').onclick=()=>loadLocations();
 }
 function locationsVisible(){
  return !view.hidden&&Boolean(document.querySelector('[data-page="locations"][aria-current="page"]'));
 }
 async function loadLocations({background=false,reservationId}={}){
  if(!locationsVisible()||(background&&(edlDialog.open||window.maloeNewReservationOpen)))return;
  const ticket=window.maloeLocationsTicket=(window.maloeLocationsTicket||0)+1;
  const screen=document.getElementById('dashboard-screen');
  if(!background)screen.innerHTML='<h2>Locations</h2><p class="muted">Chargement des réservations…</p>';
  try{
   const {data:user,error:authError}=await client.auth.getUser();if(authError||!user.user)throw Error('Session expirée');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');if(permissionError||allowed!==true)throw Error('Accès administrateur refusé');
   const {data,error}=await client.from('reservations').select('id,date_retrait,date_retour,heure_retrait,heure_retour,total,statut,expires_at,paiement_confirme_at,mode_test,retour_effectif_at,stancer_payment_intent_id,client:clients(nom,prenom),reservation_items(quantite,produit:produits(nom)),etats_des_lieux(type)').order('date_retrait',{ascending:false}).limit(100);
   if(error)throw error;
   if(ticket!==window.maloeLocationsTicket||!locationsVisible()||(background&&(edlDialog.open||window.maloeNewReservationOpen)))return;
   locationsData=data||[];
   renderLocations();
   if(reservationId){
    const card=screen.querySelector('[data-focused-reservation]');card?.scrollIntoView({block:'start',behavior:'smooth'});
    const button=Array.from(screen.querySelectorAll('[data-edl-reservation]')).find(item=>item.dataset.edlReservation===reservationId);
    button?.focus({preventScroll:true});
   }
  }catch(error){
   if(ticket!==window.maloeLocationsTicket||!locationsVisible()||edlDialog.open||(background&&window.maloeNewReservationOpen))return;
   if(background&&document.getElementById('location-refresh')){
    let warning=document.getElementById('locations-refresh-warning');
    if(!warning){
     warning=document.createElement('p');
     warning.id='locations-refresh-warning';
     warning.className='notice';
     warning.setAttribute('role','status');
     document.getElementById('location-refresh').before(warning);
    }
    warning.textContent='L’avancement n’a pas pu être actualisé. Appuie sur Actualiser pour réessayer.';
    return;
   }
   locationsData=[];
   screen.innerHTML='<h2>Locations</h2><div class="notice">Impossible de charger les réservations. Réessaie après avoir vérifié ta connexion.</div><button id="location-retry" class="logout">Réessayer</button>';
   document.getElementById('location-retry').onclick=loadLocations;
  }
 }
 window.refreshMaloeLocations=loadLocations;
 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&document.getElementById('location-filter'))loadLocations({background:true});
 });


 const escapeStock=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]||'&#39;'));
 async function loadStock(){
  const ticket=window.maloeStockTicket=(window.maloeStockTicket||0)+1,screen=document.getElementById('dashboard-screen');
  if(view.hidden||!document.querySelector('[data-page="stock"][aria-current="page"]'))return;
  screen.innerHTML='<h2>Stock et matériel</h2><p class="muted">Chargement du stock enregistré…</p>';
  try{
   const {data:user,error:authError}=await client.auth.getUser();if(authError||!user.user)throw Error('Session expirée');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');if(permissionError||allowed!==true)throw Error('Accès administrateur refusé');
   const items=[];
   for(let i=0;i<10000;i+=500){const {data,error}=await client.from('materiels').select('id,code,nom,stock,actif,famille_code,taille').order('nom').order('id').range(i,i+499);if(error)throw error;items.push(...data);if(data.length<500)break;if(i===9500)throw Error('Limite de lecture atteinte')}
   if(ticket!==window.maloeStockTicket||view.hidden||!document.querySelector('[data-page="stock"][aria-current="page"]'))return;
   const families=new Map();
   for(const item of items){const family=item.famille_code||'Autres';if(!families.has(family))families.set(family,[]);families.get(family).push(item)}
   const count=items.reduce((n,x)=>n+Math.max(0,Number(x.stock)||0),0);
   screen.innerHTML='<h2>Stock et matériel</h2><div class="cards"><div class="card"><strong>'+items.length+'</strong><small>Références matérielles</small></div><div class="card"><strong>'+count+'</strong><small>Unités enregistrées</small></div></div><div class="notice" style="margin-top:16px">Quantités enregistrées dans Supabase, pas disponibilités à une date donnée. Les réservations en cours ne sont pas déduites ici.</div>'+(items.length?[...families].sort((a,b)=>a[0].localeCompare(b[0])).map(([family,rows])=>'<section class="panel"><h3>'+escapeStock(family)+'</h3>'+rows.map(m=>'<div class="item"><div><b>'+escapeStock(m.nom||m.code||'Matériel')+'</b>'+(m.taille?'<div class="muted">Taille '+escapeStock(m.taille)+'</div>':'')+(!m.actif?'<div class="muted">Inactif</div>':'')+'</div><span>'+escapeStock(m.stock??0)+' unité(s)</span></div>').join('')+'</section>').join(''):'<section class="panel"><p class="muted">Aucun matériel enregistré.</p></section>')+'<button id="stock-refresh" class="logout">Actualiser</button><p class="muted">Lecture seule : aucun stock ne peut être modifié ici.</p>';
   document.getElementById('stock-refresh').onclick=loadStock;
  }catch(e){if(ticket!==window.maloeStockTicket||view.hidden)return;screen.innerHTML='<h2>Stock et matériel</h2><div class="notice">Impossible de charger les stocks. Aucune quantité fictive n’est affichée.</div><button id="stock-retry" class="logout">Réessayer</button>';document.getElementById('stock-retry').onclick=loadStock}
 }
 window.refreshMaloeStock=loadStock;

 form.addEventListener('submit',async event=>{event.preventDefault();if(!client){lock('Connexion indisponible.');return}status.textContent='Vérification en cours…';const {error}=await client.auth.signInWithPassword({email:document.getElementById('auth-email').value.trim(),password:document.getElementById('auth-password').value});if(error){lock('Connexion impossible. Vérifie tes identifiants.');return}await verify()});
 (async()=>{if(!window.supabase?.createClient){lock('Service de connexion indisponible. Actualise la page.');return}client=window.supabase.createClient('https://kyzixknnlgdgvxkewmzd.supabase.co','sb_publishable_E8d7sbrlOLOfs3Q9Fn30Uw_X5QqHVuL');await verify();client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')lock()})})().catch(()=>lock('Service temporairement indisponible.'));
})();
