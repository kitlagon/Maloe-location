<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a537a"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../images/logo-hero.webp"><title>Maloé Gestion — Démonstration</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#12334a;background:#f3f8fb}*{box-sizing:border-box}body{margin:0}header{background:#0a537a;color:white;padding:22px 18px 18px}header .top{display:flex;align-items:center;gap:12px;max-width:650px;margin:auto}header img{width:60px;height:60px;object-fit:contain}h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:#d5edf7;font-size:13px}.demo{background:#fff0ca;color:#684b00;text-align:center;padding:10px;font-weight:650;font-size:13px}main{max-width:650px;margin:auto;padding:18px 16px 105px}h2{font-size:20px;margin:6px 0 16px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.panel{background:white;border:1px solid #e0eaf0;border-radius:16px;padding:17px;box-shadow:0 2px 10px #15334b08}.card small{display:block;color:#607b8a;font-size:12px;margin-top:9px}.card strong{font-size:27px}.panel{margin-top:16px}.panel h3{margin:0 0 14px;font-size:16px}.item{padding:13px 0;border-top:1px solid #e9eff3;display:flex;justify-content:space-between;gap:10px}.item:first-of-type{border-top:0}.item span{color:#557486;font-size:13px}.pill{border-radius:99px;padding:5px 9px;background:#e3f2fb;color:#07547b;font-size:12px;white-space:nowrap;align-self:center}.muted{color:#637d8c;font-size:14px;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce8ee;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;max-width:130px;border:0;background:transparent;padding:12px 2px 10px;color:#5b7482;font-size:11px;cursor:pointer}.nav button[aria-current=page]{color:#07547b;font-weight:750;background:#e9f5fb}.nav b{display:block;font-size:22px;margin-bottom:3px}.notice{border-left:4px solid #0b6b9d;background:#e8f4fb;padding:12px;border-radius:8px;font-size:13px;line-height:1.5}button:focus-visible{outline:3px solid #f1b743;outline-offset:-3px}
.auth{max-width:420px;margin:24px auto;background:#fff;padding:22px;border:1px solid #dce8ee;border-radius:16px}.auth label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}.auth input{width:100%;padding:12px;border:1px solid #b4c9d5;border-radius:8px;font:inherit}.auth button,.logout{background:#0a537a;color:white;border:0;border-radius:8px;padding:12px 16px;font:inherit;margin-top:15px;cursor:pointer}.logout{margin:0 0 15px}#auth-status{color:#a12727;font-size:13px}[hidden]{display:none!important}</style></head><body>
<header><div class="top"><img src="../images/logo-hero.webp" alt=""><div><h1>Maloé Gestion</h1><p>Votre espace de gestion · Version 1</p></div></div></header>
<div class="demo">MODE DÉMONSTRATION — connexion administrateur, données fictives</div>
<section class="auth" id="auth-panel"><h2>Connexion administrateur</h2><p class="muted">Accès réservé au gestionnaire de Maloé Location.</p><form id="auth-form"><label for="auth-email">Adresse e-mail</label><input id="auth-email" type="email" autocomplete="username" required><label for="auth-password">Mot de passe</label><input id="auth-password" type="password" autocomplete="current-password" required><button type="submit">Se connecter</button></form><p id="auth-status" role="status"></p></section><main id="view" aria-live="polite" hidden><div id="dashboard-screen"></div></main>
<nav class="nav" aria-label="Navigation de l'application" hidden>
<button type="button" data-page="accueil" aria-current="page"><b>⌂</b>Accueil</button>
<button type="button" data-page="planning"><b>▦</b>Planning</button>
<button type="button" data-page="locations"><b>✓</b>Locations</button>
<button type="button" data-page="stock"><b>▣</b>Stock</button>
<button type="button" data-page="plus"><b>☰</b>Plus</button>
</nav>
<script>
const screens={
accueil:`<h2>Tableau de bord</h2><div class="cards"><div class="card"><strong>3</strong><small>Réservations du jour</small></div><div class="card"><strong>2</strong><small>Départs prévus</small></div><div class="card"><strong>1</strong><small>Retours prévus</small></div><div class="card"><strong>425 €</strong><small>CA du mois</small></div></div><section class="panel"><h3>Prochaines opérations</h3><div class="item"><div><b>09:00 · Départ PMT</b><br><span>Client fictif A</span></div><span class="pill">Départ</span></div><div class="item"><div><b>17:00 · Retour parasol</b><br><span>Client fictif B</span></div><span class="pill">Retour</span></div></section>`,
planning:`<h2>Planning</h2><div class="notice">Le calendrier sera relié aux réservations Supabase après validation de la connexion sécurisée.</div><section class="panel"><h3>Exemples d'opérations</h3><div class="item"><b>09:00 · PMT</b><span>Départ fictif</span></div><div class="item"><b>17:00 · Parasol</b><span>Retour fictif</span></div></section>`,
locations:`<h2>Locations</h2><div class="notice">Les réservations, paiements, états des lieux et documents seront accessibles ici après connexion au serveur.</div><section class="panel"><h3>Parcours prévu</h3><div class="item">Réservation <span>→</span></div><div class="item">Départ et photos <span>→</span></div><div class="item">Retour et PDF <span>→</span></div></section>`,
stock:`<h2>Stock et matériel</h2><div class="notice">La disponibilité devra respecter les stocks réels et le délai de 45 minutes entre retour et nouveau départ.</div><section class="panel"><h3>Familles de matériel</h3><div class="item">Palmes et masques <span>À connecter</span></div><div class="item">Glacières et parasols <span>À connecter</span></div><div class="item">Caméras et packs <span>À connecter</span></div></section>`,
plus:`<h2>Autres fonctions</h2><section class="panel"><h3>Fonctions à développer</h3><div class="item">Statistiques <span>À venir</span></div><div class="item">Factures <span>À venir</span></div><div class="item">Notifications <span>À venir</span></div><div class="item">Paramètres administrateur <span>À venir</span></div></section><p class="muted">Aucune donnée client ni clé secrète n'est enregistrée dans cette démonstration.</p>`
};
function show(page){if(!Object.hasOwn(screens,page))return;document.getElementById('dashboard-screen').innerHTML=screens[page];document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.page);if(b.dataset.page==='accueil'&&window.refreshMaloeDashboard)window.refreshMaloeDashboard();if(b.dataset.page==='planning'&&window.refreshMaloePlanning)window.refreshMaloePlanning();if(b.dataset.page==='locations'&&window.refreshMaloeLocations)window.refreshMaloeLocations();if(b.dataset.page==='stock'&&window.refreshMaloeStock)window.refreshMaloeStock()}));show('accueil');
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 const panel=document.getElementById('auth-panel'),view=document.getElementById('view'),nav=document.querySelector('nav.nav'),status=document.getElementById('auth-status'),form=document.getElementById('auth-form');
 let client;
 function lock(message=''){window.maloePlanningTicket=(window.maloePlanningTicket||0)+1;window.maloeDashboardTicket=(window.maloeDashboardTicket||0)+1;view.hidden=true;nav.hidden=true;panel.hidden=false;document.getElementById('auth-password').value='';status.textContent=message;}
 function unlock(){panel.hidden=true;view.hidden=false;nav.hidden=false;if(!document.getElementById('logout')){const b=document.createElement('button');b.id='logout';b.className='logout';b.textContent='Se déconnecter';view.prepend(b);b.addEventListener('click',async()=>{lock();try{await client.auth.signOut()}catch{lock('Déconnexion non confirmée. Réessaie.')}})}}
 async function verify(){const {data,error}=await client.auth.getUser();if(error||!data.user){lock();return}const {data:allowed,error:permissionError}=await client.rpc('is_admin');if(permissionError||allowed!==true){lock('Ce compte ne possède pas les droits administrateur.');return}unlock();await loadDashboard()}

 async function loadDashboard(){
  const ticket=window.maloeDashboardTicket=(window.maloeDashboardTicket||0)+1;
  const screen=document.getElementById('dashboard-screen');
  if(!screen||view.hidden)return;
  screen.innerHTML='<h2>Tableau de bord</h2><p class="muted">Chargement des réservations…</p>';
  try{
   const {data:who,error:authError}=await client.auth.getUser();
   if(authError||!who.user)throw Error('Session expirée');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');
   if(permissionError||allowed!==true)throw Error('Accès administrateur refusé');
   const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Indian/Reunion',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
   const month=today.slice(0,7);
   const end=new Date(Date.parse(month+'-01T00:00:00Z'));end.setUTCMonth(end.getUTCMonth()+1);
   const endMonth=new Date(end.getTime()-86400000).toISOString().slice(0,10);
   async function all(make){const out=[];for(let i=0;i<10000;i+=500){const {data,error}=await make().range(i,i+499);if(error)throw error;out.push(...data);if(data.length<500)return out}throw Error('Trop de réservations pour ce tableau de bord')}
   const [daily,monthly]=await Promise.all([
    all(()=>client.from('reservations').select('id,date_retrait,date_retour,heure_retrait,heure_retour,statut,expires_at,retour_effectif_at,paiement_confirme_at,mode_test,stancer_payment_status,etats_des_lieux(type)').lte('date_retrait',today).gte('date_retour',today)),
    all(()=>client.from('reservations').select('id,total,date_retrait,statut,paiement_confirme_at,mode_test,stancer_payment_status').gte('date_retrait',month+'-01').lte('date_retrait',endMonth))
   ]);
   if(ticket!==window.maloeDashboardTicket||view.hidden)return;
   const active=r=>{const s=(r.statut||'').toLowerCase();return !/annul|cancel|refus|expir/.test(s)&&!(s==='en_attente_paiement'&&(!r.expires_at||Date.parse(r.expires_at)<=Date.now()))};
   const valid=daily.filter(r=>!r.mode_test&&active(r));
   const departs=valid.filter(r=>r.date_retrait===today&&!r.retour_effectif_at).length;
   const retours=valid.filter(r=>r.date_retour===today&&!r.retour_effectif_at).length;
   const enCours=valid.filter(r=>r.date_retrait<=today&&r.date_retour>=today&&(r.statut==='en_cours'||(r.etats_des_lieux||[]).some(x=>x.type==='depart'))&&!r.retour_effectif_at).length;
   const paid=monthly.filter(r=>!r.mode_test&&active(r)&&!!r.paiement_confirme_at);
   const revenue=paid.reduce((sum,r)=>sum+(Number(r.total)||0),0);
   const euro=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(revenue);
   const safe=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
   const ops=valid.filter(r=>r.date_retrait===today||r.date_retour===today).sort((a,b)=>(a.heure_retrait||'').localeCompare(b.heure_retrait||'')).slice(0,12);
   screen.innerHTML='<h2>Tableau de bord · '+safe(today.split('-').reverse().join('/'))+'</h2><div class="cards"><div class="card"><strong>'+valid.length+'</strong><small>Locations prévues aujourd’hui</small></div><div class="card"><strong>'+departs+'</strong><small>Départs prévus</small></div><div class="card"><strong>'+retours+'</strong><small>Retours prévus</small></div><div class="card"><strong>'+enCours+'</strong><small>Locations en cours (estimées)</small></div></div><section class="panel"><h3>Réservations payées · mois en cours</h3><strong>'+safe(euro)+'</strong><p class="muted">Total des réservations confirmées payées, classées par date de retrait. Hors tests et remboursements éventuels.</p></section><section class="panel"><h3>Opérations du jour</h3>'+(ops.length?ops.map(r=>'<div class="item"><b>'+safe(r.date_retrait===today?'Départ '+(r.heure_retrait||''):'Retour '+(r.heure_retour||''))+'</b><span>Réservation '+safe(String(r.id).slice(0,8))+'</span></div>').join(''):'<p class="muted">Aucune opération prévue aujourd’hui.</p>')+'</section><p class="muted">Lecture seule · actualisation à chaque ouverture de l’accueil. Les réservations de test sont exclues.</p>';
  }catch(error){if(ticket!==window.maloeDashboardTicket||view.hidden)return;screen.innerHTML='<h2>Tableau de bord</h2><div class="notice">Impossible de charger les réservations. Aucune donnée fictive n’est affichée. Vérifie ta connexion et réessaie.</div><button id="retry-dashboard" class="logout">Réessayer</button>';document.getElementById('retry-dashboard').onclick=loadDashboard;}
 }
 window.refreshMaloeDashboard=loadDashboard;


 let planningAnchor=new Intl.DateTimeFormat('en-CA',{timeZone:'Indian/Reunion',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),planningMode='day';
 const safePlanning=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]||'&#39;'));
 function moveDay(date,amount){const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+amount);return d.toISOString().slice(0,10)}
 function dayLabel(date){return new Date(date+'T00:00:00Z').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})}
 async function loadPlanning(){
  const ticket=window.maloePlanningTicket=(window.maloePlanningTicket||0)+1;
  const screen=document.getElementById('dashboard-screen');if(view.hidden||!screen||!document.querySelector('[data-page="planning"][aria-current="page"]'))return;
  screen.innerHTML='<h2>Planning</h2><p class="muted">Chargement des locations…</p>';
  try{
   const {data:who,error:authError}=await client.auth.getUser();if(authError||!who.user)throw Error('Session expirée');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');if(permissionError||allowed!==true)throw Error('Accès administrateur refusé');
   const start=planningMode==='day'?planningAnchor:moveDay(planningAnchor,-((new Date(planningAnchor+'T00:00:00Z').getUTCDay()+6)%7));
   const end=moveDay(start,planningMode==='day'?0:6);
   const rows=[];for(let i=0;i<10000;i+=500){const {data,error}=await client.from('reservations').select('id,date_retrait,date_retour,heure_retrait,heure_retour,statut,expires_at,mode_test,retour_effectif_at,client:clients(nom,prenom),reservation_items(quantite,produit:produits(nom)),etats_des_lieux(type)').lte('date_retrait',end).gte('date_retour',start).order('date_retrait').range(i,i+499);if(error)throw error;rows.push(...data);if(data.length<500)break;if(i===9500)throw Error('Trop de réservations')}
   if(ticket!==window.maloePlanningTicket||view.hidden||!document.querySelector('[data-page="planning"][aria-current="page"]'))return;
   const active=r=>{const s=(r.statut||'').toLowerCase();return !r.mode_test&&!/annul|cancel|refus|expir/.test(s)&&!(s==='en_attente_paiement'&&(!r.expires_at||Date.parse(r.expires_at)<=Date.now()))};
   const list=rows.filter(active);
   const dates=[];for(let d=start;d<=end;d=moveDay(d,1))dates.push(d);
   const entries=dates.map(d=>{const events=[];for(const r of list){const cl=Array.isArray(r.client)?r.client[0]:r.client;const name=[cl?.prenom,cl?.nom].filter(Boolean).join(' ')||'Client non renseigné';const gear=(r.reservation_items||[]).map(i=>(i.quantite||1)+' × '+(Array.isArray(i.produit)?i.produit[0]?.nom:i.produit?.nom||'Matériel')).join(', ');if(r.date_retrait===d)events.push({time:r.heure_retrait||'--:--',kind:'Départ',name,gear});if(r.date_retour===d)events.push({time:r.heure_retour||'--:--',kind:'Retour',name,gear})}events.sort((a,b)=>a.time.localeCompare(b.time));return '<section class="panel"><h3>'+safePlanning(dayLabel(d))+'</h3>'+(events.length?events.map(e=>'<div class="item"><div><b>'+safePlanning(e.time)+' · '+safePlanning(e.kind)+'</b><div>'+safePlanning(e.name)+'</div><small>'+safePlanning(e.gear||'Matériel non renseigné')+'</small></div></div>').join(''):'<p class="muted">Aucun départ ni retour prévu.</p>')+'</section>'}).join('');
   screen.innerHTML='<h2>Planning des locations</h2><div class="panel"><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="plan-day" class="logout" aria-pressed="'+(planningMode==='day')+'">Jour</button><button id="plan-week" class="logout" aria-pressed="'+(planningMode==='week')+'">Semaine</button></div><div style="display:flex;gap:8px;align-items:center;justify-content:space-between"><button id="plan-prev" class="logout" aria-label="Précédent">‹</button><b>'+safePlanning(dayLabel(start))+(planningMode==='week'?' – '+safePlanning(dayLabel(end)):'')+'</b><button id="plan-next" class="logout" aria-label="Suivant">›</button></div><button id="plan-today" class="logout">Aujourd’hui</button></div>'+entries+'<p class="muted">Lecture seule · réservations de test et annulations exclues. Le délai de 45 minutes reste appliqué côté serveur pour la disponibilité du matériel.</p>';
   document.getElementById('plan-day').onclick=()=>{planningMode='day';loadPlanning()};
   document.getElementById('plan-week').onclick=()=>{planningMode='week';loadPlanning()};
   document.getElementById('plan-prev').onclick=()=>{planningAnchor=moveDay(planningAnchor,planningMode==='day'?-1:-7);loadPlanning()};
   document.getElementById('plan-next').onclick=()=>{planningAnchor=moveDay(planningAnchor,planningMode==='day'?1:7);loadPlanning()};
   document.getElementById('plan-today').onclick=()=>{planningAnchor=new Intl.DateTimeFormat('en-CA',{timeZone:'Indian/Reunion',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());loadPlanning()};
  }catch(e){if(ticket!==window.maloePlanningTicket||view.hidden)return;screen.innerHTML='<h2>Planning</h2><div class="notice">Impossible de charger le planning. Aucune donnée fictive n’est affichée.</div><button id="plan-retry" class="logout">Réessayer</button>';document.getElementById('plan-retry').onclick=loadPlanning}
 }
 window.refreshMaloePlanning=loadPlanning;


 let locationsData=[],locationsFilter='actives';
 const escLocation=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]||'&#39;'));
 function locationStatus(r){
  const s=(r.statut||'').toLowerCase();
  if(/annul|cancel|refus|expir/.test(s))return 'Annulée';
  if(s==='en_attente_paiement'&&(!r.expires_at||Date.parse(r.expires_at)<=Date.now()))return 'Expirée';
  if(r.retour_effectif_at||(r.etats_des_lieux||[]).some(x=>x.type==='retour'))return 'Retournée';
  if(s==='en_cours'||(r.etats_des_lieux||[]).some(x=>x.type==='depart'))return 'En cours';
  if(r.paiement_confirme_at)return 'Confirmée · payée';
  return r.statut||'À vérifier';
 }
 function renderNewReservationForm(){
 const screen=document.getElementById('dashboard-screen');if(!screen||view.hidden)return;
 screen.innerHTML='<h2>Nouvelle réservation</h2><div class="notice">Formulaire de préparation : l’enregistrement sécurisé et le blocage du stock ne sont pas encore activés. Aucune réservation ne sera créée depuis cet écran.</div><section class="panel"><h3>Client</h3><label>Prénom <input id="new-first" autocomplete="given-name" style="width:100%;padding:10px"></label><label>Nom <input id="new-last" autocomplete="family-name" style="width:100%;padding:10px"></label><label>Téléphone <input id="new-phone" type="tel" style="width:100%;padding:10px"></label><label>E-mail <input id="new-email" type="email" style="width:100%;padding:10px"></label></section><section class="panel"><h3>Dates et horaires</h3><label>Départ <input type="date" style="width:100%;padding:10px"></label><label>Heure de départ <input type="time" style="width:100%;padding:10px"></label><label>Retour <input type="date" style="width:100%;padding:10px"></label><label>Heure de retour <input type="time" style="width:100%;padding:10px"></label></section><section class="panel"><h3>Matériel et paiement</h3><p class="muted">Catalogue réel · prix indicatifs issus de la grille enregistrée. Le tarif final et les disponibilités devront être validés par le serveur.</p><div id="new-catalog">Chargement du catalogue…</div><p id="new-total"></p><label>Mode de paiement <select style="width:100%;padding:10px"><option>Paiement sur place — à encaisser</option><option>Lien de paiement Stancer — en attente</option></select></label></section><button id="new-reservation-back" class="logout">Retour aux locations</button>';
 document.getElementById('new-reservation-back').onclick=()=>{window.maloeNewReservationOpen=false;renderLocations()};
 loadNewReservationCatalog();

 }
 async function loadNewReservationCatalog(){
 const host=document.getElementById('new-catalog');if(!host)return;
 try{
 const {data:user,error:authError}=await client.auth.getUser();if(authError||!user.user)throw Error('Session expirée');
 const {data:admin,error:adminError}=await client.rpc('is_admin');if(adminError||admin!==true)throw Error('Accès administrateur refusé');
 const {data,error}=await client.from('produits').select('id,nom,actif,prix_1_2j,prix_3_5j,prix_5j_plus,caution').eq('actif',true).order('nom');
 if(error)throw error;if(!host.isConnected)return;
 host.innerHTML=(data||[]).map(p=>'<div class="item"><div><b>'+escLocation(p.nom)+'</b><div class="muted">Tarif de base : '+escLocation(p.prix_1_2j??'—')+' €/jour · caution '+escLocation(p.caution??'—')+' €</div></div><label>Qté <input type="number" min="0" max="20" value="0" data-product="'+escLocation(p.id)+'" style="width:66px;padding:8px"></label></div>').join('')||'<p>Aucun produit actif.</p>';
 document.getElementById('new-total').textContent='Sélectionne les articles. Le calcul définitif sera ajouté après vérification des règles tarifaires.';
 }catch(e){if(host.isConnected)host.textContent='Catalogue indisponible : '+e.message}
 }
 function renderLocations(){
  const screen=document.getElementById('dashboard-screen');
  if(view.hidden||!document.querySelector('[data-page="locations"][aria-current="page"]'))return;
  const selected=locationsData.filter(r=>locationsFilter==='toutes'||(locationsFilter==='actives'&&!/annul|cancel|refus|expir/.test((r.statut||'').toLowerCase())&&locationStatus(r)!=='Expirée')||(locationsFilter==='tests'&&r.mode_test));
  const rows=(locationsFilter==='tests'?selected:selected.filter(r=>!r.mode_test)).slice(0,100);
  if(window.maloeNewReservationOpen){renderNewReservationForm();return}
  screen.innerHTML='<h2>Locations</h2><p class="muted">Les 100 dernières réservations affichables · lecture seule</p><div class="panel"><label for="location-filter"><b>Afficher</b></label> <select id="location-filter" style="padding:10px;max-width:100%;border:1px solid #b4c9d5;border-radius:8px"><option value="actives">Réservations actives</option><option value="toutes">Toutes (hors tests)</option><option value="tests">Réservations de test</option></select></div>'+(rows.length?rows.map(r=>{const cl=Array.isArray(r.client)?r.client[0]:r.client;const name=[cl?.prenom,cl?.nom].filter(Boolean).join(' ')||'Client non renseigné';const gear=(r.reservation_items||[]).map(i=>String(i.quantite||1)+' × '+(Array.isArray(i.produit)?i.produit[0]?.nom:i.produit?.nom||'Matériel')).join(', ');const euro=Number.isFinite(Number(r.total))?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(r.total)):'Montant non renseigné';return '<section class="panel"><h3>'+escLocation(name)+'</h3><p class="muted">'+escLocation(r.date_retrait||'?')+' → '+escLocation(r.date_retour||'?')+'</p><p>'+escLocation(gear||'Matériel non renseigné')+'</p><div class="item"><b>'+escLocation(locationStatus(r))+'</b><span>'+escLocation(euro)+'</span></div><details><summary>Voir les détails</summary><p>Départ : '+escLocation(r.heure_retrait||'—')+' · Retour : '+escLocation(r.heure_retour||'—')+'</p><p>Paiement : '+escLocation(r.paiement_confirme_at?'Confirmé':'Non confirmé')+'</p><p>Référence : '+escLocation(r.id)+'</p><p><a class="logout" style="display:inline-block;text-decoration:none" href="../etat-des-lieux.html?reservation_id='+encodeURIComponent(r.id)+'" target="_blank" rel="noopener noreferrer">Ouvrir les états des lieux</a></p><p class="muted">La page sécurisée s’ouvre séparément : connecte-toi si demandé, puis sélectionne cette réservation.</p></details></section>'}).join(''):'<div class="panel"><p class="muted">Aucune réservation pour ce filtre.</p></div>')+'<button id="location-refresh" class="logout">Actualiser</button>';
  const createButton=document.createElement('button');createButton.className='logout';createButton.textContent='+ Nouvelle réservation';createButton.style.marginTop='12px';createButton.onclick=()=>{window.maloeNewReservationOpen=true;renderNewReservationForm()};screen.insertBefore(createButton,screen.querySelector('.panel'));
  document.getElementById('location-filter').value=locationsFilter;
  document.getElementById('location-filter').onchange=e=>{locationsFilter=e.target.value;renderLocations()};
  document.getElementById('location-refresh').onclick=loadLocations;
 }
 async function loadLocations(){

  const screen=document.getElementById('dashboard-screen');
  if(view.hidden||!document.querySelector('[data-page="locations"][aria-current="page"]'))return;
  screen.innerHTML='<h2>Locations</h2><p class="muted">Chargement des réservations…</p>';
  try{
   const {data:user,error:authError}=await client.auth.getUser();if(authError||!user.user)throw Error('Session expirée');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');if(permissionError||allowed!==true)throw Error('Accès administrateur refusé');
   const {data,error}=await client.from('reservations').select('id,date_retrait,date_retour,heure_retrait,heure_retour,total,statut,expires_at,paiement_confirme_at,mode_test,retour_effectif_at,client:clients(nom,prenom),reservation_items(quantite,produit:produits(nom)),etats_des_lieux(type)').order('date_retrait',{ascending:false}).limit(100);
   if(error)throw error;

 }
 window.refreshMaloeLocations=loadLocations;


 const escapeStock=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]||'&#39;'));
 async function loadStock(){
  const ticket=window.maloeStockTicket=(window.maloeStockTicket||0)+1,screen=document.getElementById('dashboard-screen');
  if(view.hidden||!document.querySelector('[data-page="stock"][aria-current="page"]'))return;
  screen.innerHTML='<h2>Stock et matériel</h2><p class="muted">Chargement du stock enregistré…</p>';
  try{
   const {data:user,error:authError}=await client.auth.getUser();if(authError||!user.user)throw Error('Session expirée');
   const {data:allowed,error:permissionError}=await client.rpc('is_admin');if(permissionError||allowed!==true)throw Error('Accès administrateur refusé');
   const items=[];
   for(let i=0;i<10000;i+=500){const {data,error}=await client.from('materiels').select('id,code,nom,stock,actif,famille_code,taille').order('nom').order('id').range(i,i+499);if(error)throw error;items.push(...data);if(data.length<500)break;if(i===9500)throw Error('Limite de lecture atteinte')}
   if(ticket!==window.maloeStockTicket||view.hidden||!document.querySelector('[data-page="stock"][aria-current="page"]'))return;
   const families=new Map();
   for(const item of items){const family=item.famille_code||'Autres';if(!families.has(family))families.set(family,[]);families.get(family).push(item)}
   const count=items.reduce((n,x)=>n+Math.max(0,Number(x.stock)||0),0);
   screen.innerHTML='<h2>Stock et matériel</h2><div class="cards"><div class="card"><strong>'+items.length+'</strong><small>Références matérielles</small></div><div class="card"><strong>'+count+'</strong><small>Unités enregistrées</small></div></div><div class="notice" style="margin-top:16px">Quantités enregistrées dans Supabase, pas disponibilités à une date donnée. Les réservations en cours ne sont pas déduites ici.</div>'+(items.length?[...families].sort((a,b)=>a[0].localeCompare(b[0])).map(([family,rows])=>'<section class="panel"><h3>'+escapeStock(family)+'</h3>'+rows.map(m=>'<div class="item"><div><b>'+escapeStock(m.nom||m.code||'Matériel')+'</b>'+(m.taille?'<div class="muted">Taille '+escapeStock(m.taille)+'</div>':'')+(!m.actif?'<div class="muted">Inactif</div>':'')+'</div><span>'+escapeStock(m.stock??0)+' unité(s)</span></div>').join('')+'</section>').join(''):'<section class="panel"><p class="muted">Aucun matériel enregistré.</p></section>')+'<button id="stock-refresh" class="logout">Actualiser</button><p class="muted">Lecture seule : aucun stock ne peut être modifié ici.</p>';
   document.getElementById('stock-refresh').onclick=loadStock;
  }catch(e){if(ticket!==window.maloeStockTicket||view.hidden)return;screen.innerHTML='<h2>Stock et matériel</h2><div class="notice">Impossible de charger les stocks. Aucune quantité fictive n’est affichée.</div><button id="stock-retry" class="logout">Réessayer</button>';document.getElementById('stock-retry').onclick=loadStock}
 }
 window.refreshMaloeStock=loadStock;
