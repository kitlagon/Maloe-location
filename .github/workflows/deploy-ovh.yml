name: Vérifier le serveur SFTP OVH (sans transfert)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sftp-host:
    runs-on: ubuntu-latest
    steps:
      - name: Installer les outils SSH
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Afficher les empreintes du serveur OVH
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
        run: |
          set -eu
          if [ -z "${OVH_SFTP_HOST:-}" ]; then
            echo "Le secret OVH_SFTP_HOST est absent."
            exit 1
          fi
          echo "Serveur testé : $OVH_SFTP_HOST:22"
          echo "Récupération des clés publiques présentées par le serveur (aucun fichier ne sera envoyé)."
          ssh-keyscan -T 10 -p 22 "$OVH_SFTP_HOST" 2>/dev/null > hostkeys.txt
          if [ ! -s hostkeys.txt ]; then
            echo "Aucune clé reçue. Vérifie le nom du serveur et la disponibilité du SFTP."
            exit 1
          fi
          echo "Empreintes observées :"
          ssh-keygen -lf hostkeys.txt
          echo ""
          echo "IMPORTANT : ces empreintes sont observées, mais ne sont pas encore authentifiées auprès d'OVH."
          echo "Aucun identifiant/mot de passe n'a été utilisé et aucun fichier n'a été transféré.";
