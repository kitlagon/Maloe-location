<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre panier — Maloé Location</title>
<meta name="description" content="Récapitulatif de votre réservation Maloé Location.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --lagoon-deep:#0B4F4A;
    --lagoon-bright:#1B8A82;
    --sand:#F1E6CE;
    --sand-light:#FAF5E9;
    --coral:#E8622E;
    --ink:#132420;
    --ink-soft:rgba(19,36,32,0.7);
    --line:rgba(19,36,32,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand-light);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.55;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0 0 0.4em 0;letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:0 28px;}

  header{border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;max-width:760px;margin:0 auto;padding-left:28px;padding-right:28px;}
  .logo{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;display:flex;align-items:center;gap:18px;text-decoration:none;color:var(--ink);}
  .logo-mark{width:26px;height:26px;flex:none;}
  .logo-img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;}
  .back-link{font-size:0.88rem;text-decoration:none;color:var(--ink-soft);}
  .back-link:hover{color:var(--ink);}

  main{padding:48px 0 80px;}
  h1{font-size:1.7rem;margin-bottom:6px;}
  .subtitle{color:var(--ink-soft);font-size:0.95rem;margin-bottom:32px;}

  .dates-summary{
    display:flex;gap:24px;background:var(--sand);border-radius:12px;padding:16px 20px;margin-bottom:28px;
    font-size:0.9rem;flex-wrap:wrap;
  }
  .dates-summary div strong{display:block;font-size:0.78rem;color:var(--ink-soft);font-weight:500;margin-bottom:2px;}

  .cart-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 0;border-bottom:1px solid var(--line);gap:14px;
  }
  .cart-item-main{display:flex;align-items:center;gap:14px;min-width:0;flex:1;}
  .cart-item-thumb{width:88px;height:76px;object-fit:cover;border-radius:10px;background:var(--sand);flex:none;}
  .cart-item-info{min-width:0;flex:1;}
  .cart-item-actions{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap;}
  .cart-qty-control{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:#fff;}
  .cart-qty-control button{width:30px;height:29px;border:0;background:transparent;font:inherit;font-size:1.1rem;cursor:pointer;color:var(--lagoon-deep);}
  .cart-qty-control span{min-width:26px;text-align:center;font-size:.88rem;font-weight:600;}
  .cart-item-remove{margin:0;}
  @media(max-width:480px){
    .cart-item-thumb{width:68px;height:68px;}
    .cart-item{gap:8px;padding:13px;}
    .cart-item-main{gap:10px;}
    .cart-item-price{font-size:.95rem;}
  }
  .cart-item-name{font-weight:500;font-size:0.96rem;}
  .cart-item-meta{color:var(--ink-soft);font-size:0.82rem;margin-top:3px;}
  .cart-item-price{text-align:right;white-space:nowrap;font-size:0.94rem;}
  .cart-item-remove{background:none;border:none;color:var(--coral);cursor:pointer;font-size:0.8rem;text-decoration:underline;font-family:inherit;margin-top:4px;display:block;}

  .cart-total{display:flex;justify-content:space-between;padding-top:18px;font-size:1.1rem;font-weight:500;}
  .caution-note{font-size:0.82rem;color:var(--coral);margin-top:6px;}

  .contact-panel{background:var(--sand-light);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:32px;}
  .contact-panel h3{font-size:1.02rem;margin-bottom:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.84rem;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:0.92rem;background:white;color:var(--ink);}

  .btn{display:inline-block;padding:13px 24px;border-radius:100px;text-decoration:none;font-weight:500;font-size:0.94rem;border:none;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--coral);color:white;}
  .send-btn{width:100%;text-align:center;margin-top:6px;}
  .form-note{font-size:0.78rem;color:var(--ink-soft);margin-top:10px;}

  .empty-state{padding:60px 0;text-align:center;color:var(--ink-soft);}
  .empty-state a{color:var(--coral);text-decoration:underline;}

  /* Nouvelle présentation du panier : claire, moderne et responsive */
  .wrap{max-width:900px;padding:0 22px}
  main{padding:38px 0 72px}
  h1{font-size:2rem;color:var(--lagoon-deep)}
  .subtitle{margin-bottom:24px}
  .dates-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px rgba(19,36,32,.04)}
  .dates-summary div{padding:4px 8px}
  .dates-summary div strong{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
  .contact-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:22px;box-shadow:0 5px 20px rgba(19,36,32,.04)}
  .contact-panel h3{font-size:1.18rem;color:var(--lagoon-deep)}
  .cart-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 14px rgba(19,36,32,.035)}
  .cart-item-name{font-size:1rem;color:var(--lagoon-deep)}
  .cart-item-price{font-size:1.05rem;font-weight:600}
  .cart-total{padding:18px 4px;font-size:1.12rem}
  .caution-note{color:var(--ink-soft);background:var(--sand-light);border-radius:10px;padding:10px 12px}
  .field input,.field textarea{padding:13px 14px;border-radius:10px;border-color:#d8ded9}
  .field input:focus,.field textarea:focus{outline:2px solid rgba(27,138,130,.22);border-color:var(--lagoon-bright)}
  .btn{transition:transform .15s ease,opacity .15s ease}
  .btn-primary{background:var(--lagoon-deep)}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed}
  .payment-info{font-size:.86rem;color:var(--ink-soft);background:var(--sand-light);padding:13px 15px;border-radius:10px;margin:12px 0}
  @media(max-width:600px){
    .wrap{padding:0 16px}
    main{padding:26px 0 48px}
    h1{font-size:1.65rem}
    .dates-summary{grid-template-columns:1fr 1fr;padding:14px;gap:8px}
    .dates-summary div:last-child{grid-column:1/-1}
    .contact-panel{padding:18px}
    .cart-item{align-items:flex-start}
  }

</style>
<link rel="stylesheet" href="styles/maloe-theme.css">
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html">
      <img class="logo-img" src="images/logo.jpg" alt="Maloé Location">
      Maloé Location
    </a>
    <a class="back-link" href="index.html" id="continue-shopping">← Continuer mes achats</a>
  </div>
</header>

<main>
  <div class="wrap" id="content"></div>
</main>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var catalogue = [];

  // Turnstile : le jeton sera transmis au serveur lors du branchement du formulaire.
  var turnstileToken = "";
  var turnstileWidgetId = null;
  var turnstileRendering = false;

  function renderTurnstileWidget(){
    var container = document.getElementById("turnstile-container");
    if (!container || !window.turnstile || turnstileRendering || turnstileWidgetId !== null) return;
    turnstileRendering = true;
    turnstileWidgetId = window.turnstile.render(container, {
      sitekey: "0x4AAAAAAFwoHDEYsq911gz7",
      callback: function(token){
        turnstileToken = token;
        var status = document.getElementById("turnstile-status");
        if (status) status.textContent = "Vérification anti-robot effectuée.";
      },
      "expired-callback": function(){
        turnstileToken = "";
        var status = document.getElementById("turnstile-status");
        if (status) status.textContent = "La vérification a expiré. Veuillez recommencer.";
      },
      "error-callback": function(){
        turnstileToken = "";
        var status = document.getElementById("turnstile-status");
        if (status) status.textContent = "La vérification est indisponible. Réessayez.";
      },
      theme: "light"
    });
    turnstileRendering = false;
  }

  // L'API peut se charger avant ou après l'affichage du formulaire.
  var turnstileWaitCount = 0;
  function waitForTurnstile(){
    if (window.turnstile) {
      renderTurnstileWidget();
      return;
    }
    if (turnstileWaitCount++ < 40) window.setTimeout(waitForTurnstile, 250);
    else {
      var status = document.getElementById("turnstile-status");
      if (status) status.textContent = "Le contrôle anti-robot n'a pas pu se charger. Actualisez la page.";
    }
  }

  // Conserver le panier, les dates et les créneaux en revenant au catalogue.
  document.getElementById("continue-shopping").addEventListener("click", function (event) {
    event.preventDefault();
    window.location.href = "index.html" + window.location.search + "#catalogue";
  });

  function findItem(id){
    for (var i = 0; i < catalogue.length; i++){
      if (catalogue[i].id === id) return catalogue[i];
    }
    return null;
  }

  function getTierIndex(days){
    if (days === null) return null;
    if (days <= 2) return 0;
    if (days <= 5) return 1;
    return 2;
  }

  function computeLineTotal(id, qty, unit, mult){
    return Math.round(unit * mult * qty * 100) / 100;
  }

  function flattenCatalogue(groups){
    var flat = [];
    groups.forEach(function (g) {
      g.items.forEach(function (item) { flat.push(item); });
    });
    return flat;
  }

  function toMinutes(hhmm){
    var p = hhmm.split(":");
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }
  function fromMinutes(mins){
    var h = Math.floor(mins / 60), m = mins % 60;
    return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  }
  var DAY_NAMES_FR = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  function dayNameFor(dateStr){
    var d = new Date(dateStr + "T12:00");
    return DAY_NAMES_FR[d.getDay()];
  }
  function generateSlotsForDate(timeSlots, dateStr){
    var slots = [];
    var interval = (timeSlots && timeSlots.interval) || 15;
    var byDay = (timeSlots && timeSlots.byDay) || {};
    var overrides = (timeSlots && timeSlots.dateOverrides) || {};
    var windows = overrides.hasOwnProperty(dateStr) ? overrides[dateStr] : (byDay[dayNameFor(dateStr)] || []);
    windows.forEach(function (w) {
      var cur = toMinutes(w.start);
      var end = toMinutes(w.end);
      while (cur < end){
        slots.push(fromMinutes(cur));
        cur += interval;
      }
      // L'heure de fermeture à 18 h est aussi un créneau autorisé.
      if (end === 18 * 60 && slots.indexOf("18:00") === -1) slots.push("18:00");
    });
    return slots;
  }

  document.getElementById("content").innerHTML = '<p style="color:var(--ink-soft);">Chargement...</p>';
  fetch("products.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      catalogue = flattenCatalogue(data.groups);
      var promoCodes = data.promoCodes || [];
      var timeSlots = data.timeSlots || { interval: 15, byDay: {} };
      var takenSlots = data.takenSlots || [];

      function isSlotTaken(date, time){
        return takenSlots.some(function (t) { return t.date === date && t.time === time; });
      }
      function availableSlotsFor(date, afterTime){
        if (!date) return [];
        var slots = generateSlotsForDate(timeSlots, date).filter(function (t) { return !isSlotTaken(date, t); });
        if (afterTime) slots = slots.filter(function (t) { return t > afterTime; });
        return slots;
      }

      var params = new URLSearchParams(window.location.search);
      var retrait = params.get("retrait") || "";
      var retour = params.get("retour") || "";
      var incomingSlotRetrait = params.get("slotRetrait") || "";
      var incomingSlotRetour = params.get("slotRetour") || "";

      var lines = [];
      try {
        var raw = JSON.parse(params.get("cart") || "[]");
        raw.forEach(function (l) {
          if (l && l.id && findItem(l.id) && l.qty > 0){
            lines.push({ id: l.id, sizes: l.sizes || {}, qty: l.qty });
          }
        });
      } catch (e) { lines = []; }

      function idTotalQty(id){
        var t = 0;
        lines.forEach(function (l) { if (l.id === id) t += l.qty; });
        return t;
      }

      function saveCartAndReload(){
        var newParams = new URLSearchParams();
        if (lines.length) newParams.set("cart", JSON.stringify(lines));
        if (retrait) newParams.set("retrait", retrait);
        if (retour) newParams.set("retour", retour);
        if (selectedRetraitSlot) newParams.set("slotRetrait", selectedRetraitSlot);
        if (selectedRetourSlot) newParams.set("slotRetour", selectedRetourSlot);
        window.location.search = newParams.toString();
      }

      function changeLineQty(index, delta){
        var line = lines[index];
        if (!line) return;
        line.qty += delta;
        if (line.qty <= 0) lines.splice(index, 1);
        saveCartAndReload();
      }

      function removeLine(index){
        lines.splice(index, 1);
        saveCartAndReload();
      }

      function formatDate(iso){
        if (!iso) return "à préciser";
        var d = new Date(iso);
        return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });
      }

      var appliedPromo = null;
      var selectedRetraitSlot = incomingSlotRetrait;
      var selectedRetourSlot = incomingSlotRetour;

      function resolveSlot(date, which){
        if (!date) return "";
        var afterTime = (which === "retour" && retrait && date === retrait) ? selectedRetraitSlot : null;
        var slots = availableSlotsFor(date, afterTime);
        var current = which === "retrait" ? selectedRetraitSlot : selectedRetourSlot;
        if (slots.indexOf(current) === -1) current = slots[0] || "";
        if (which === "retrait") selectedRetraitSlot = current; else selectedRetourSlot = current;
        return current;
      }

      function computeDays(){
        if (!retrait || !retour) return null;
        var retraitSlot = resolveSlot(retrait, "retrait");
        var retourSlot = resolveSlot(retour, "retour");
        var d1 = new Date(retrait);
        var d2 = new Date(retour);
        var diffDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return null;

        // Règle spéciale : retrait après 17 h, retour le lendemain jusqu'à 18 h inclus = 1 jour.
        if (diffDays === 1 && retraitSlot && retourSlot &&
            toMinutes(retraitSlot) >= 17 * 60 && toMinutes(retourSlot) <= 18 * 60) {
          return 1;
        }
        if (retraitSlot && retourSlot){
          var start = new Date(retrait + "T" + retraitSlot);
          var end = new Date(retour + "T" + retourSlot);
          var diffHours = (end - start) / (1000 * 60 * 60);
          return diffHours > 0 ? Math.max(1, Math.ceil(diffHours / 24)) : null;
        }
        return diffDays + 1;
      }

      function slotDisplayHtml(date, which){
        if (!date) return '<p class="help" style="font-size:0.82rem;color:var(--ink-soft);margin:0;">Non choisi</p>';
        var afterTime = (which === "retour" && retrait && date === retrait) ? selectedRetraitSlot : null;
        var slots = availableSlotsFor(date, afterTime);
        var current = resolveSlot(date, which);
        if (!current || slots.length === 0){
          return '<p class="caution-note" style="margin:0;">Ce créneau n\'est plus disponible — modifiez-le sur la page précédente.</p>';
        }
        return '<p style="margin:0;font-weight:500;">' + current + '</p>';
      }

      function findValidPromo(codeInput){
        var code = codeInput.trim().toUpperCase();
        var match = promoCodes.filter(function (p) { return p.code.toUpperCase() === code; })[0];
        if (!match) return { error: "Code promo introuvable." };
        if (!retrait) return { error: "Choisissez d'abord vos dates sur la page précédente pour vérifier ce code." };
        if (retrait < match.from || retrait > match.to) return { error: "Ce code n'est valable que pour une location débutant entre le " + formatDate(match.from) + " et le " + formatDate(match.to) + "." };
        return { promo: match };
      }

      function render(){
        var days = computeDays();
        var tierIndex = getTierIndex(days);
        var content = document.getElementById("content");

        if (lines.length === 0){
          content.innerHTML =
            '<div class="empty-state"><h1>Votre panier est vide</h1>' +
            '<p>Ajoutez des kits depuis <a href="index.html#catalogue">le catalogue</a>.</p></div>';
          return;
        }

        var itemsHtml = "";
        var total = 0;
        var totalCaution = 0;

        lines.forEach(function (line, idx) {
          var item = findItem(line.id);
          var qty = line.qty;
          var unit = tierIndex === null ? item.prices[2] : (item.pricesTotal ? (item.pricesTotal[Math.min(days,7)-1] + Math.max(0,days-7)*(item.id === 'cam360' ? 14 : 15)) / days : item.prices[tierIndex]);
          var mult = tierIndex === null ? 1 : days;
          var itemLineTotal = computeLineTotal(line.id, idTotalQty(line.id), unit, mult) * (qty / idTotalQty(line.id));
          itemLineTotal = Math.round(itemLineTotal * 100) / 100;
          total += itemLineTotal;
          totalCaution += item.caution * qty;

          var sizeText = (line.sizes && Object.keys(line.sizes).length) ? " · " + Object.values(line.sizes).join(" · ") : "";
          var metaText = tierIndex === null
            ? "Quantité : " + qty + sizeText + " · dès " + unit + " €/jour (choisissez vos dates pour le tarif exact)"
            : "Quantité : " + qty + sizeText + " · " + unit + " €/jour × " + days + " jour" + (days > 1 ? "s" : "");

          var imagePath = 'images/kits/' + item.id + '.jpg?v=' + (data.photoVersion || 1);
          itemsHtml += '<div class="cart-item">' +
            '<div class="cart-item-main">' +
              '<img class="cart-item-thumb" src="' + imagePath + '" alt="' + item.name + '" onerror="this.style.display=\'none\'">' +
              '<div class="cart-item-info"><div class="cart-item-name">' + item.name + '</div>' +
              '<div class="cart-item-meta">' + metaText + '</div>' +
              '<div class="cart-item-actions">' +
                '<div class="cart-qty-control" aria-label="Modifier la quantité">' +
                  '<button type="button" data-qty="-1" data-index="' + idx + '" aria-label="Diminuer la quantité">−</button>' +
                  '<span>' + qty + '</span>' +
                  '<button type="button" data-qty="1" data-index="' + idx + '" aria-label="Augmenter la quantité">+</button>' +
                '</div>' +
                '<button type="button" class="cart-item-remove" data-remove="' + idx + '">Supprimer</button>' +
              '</div></div></div>' +
            '<div class="cart-item-price">' + itemLineTotal + ' €</div>' +
            '</div>';
        });

        var subtotal = Math.round(total * 100) / 100;
        var finalTotal = subtotal;
        var promoLineHtml = "";
        if (appliedPromo){
          finalTotal = Math.round(subtotal * (1 - appliedPromo.discount) * 100) / 100;
          promoLineHtml = '<div class="cart-total" style="font-size:0.9rem;color:var(--lagoon-deep);"><span>Code ' + appliedPromo.code + ' (-' + Math.round(appliedPromo.discount * 100) + '%)</span><span>−' + (Math.round((subtotal - finalTotal) * 100) / 100) + ' €</span></div>';
        }

        var promoBlockHtml = appliedPromo
          ? '<p class="form-note">Code promo <strong>' + appliedPromo.code + '</strong> appliqué. <button type="button" id="promo-remove" style="background:none;border:none;color:var(--coral);text-decoration:underline;cursor:pointer;font-family:inherit;">Retirer</button></p>'
          : '<div class="field" style="display:flex;gap:8px;align-items:flex-end;">' +
              '<div style="flex:1;"><label for="promo-input" style="display:block;font-size:0.84rem;color:var(--ink-soft);margin-bottom:6px;">Code promo</label><input type="text" id="promo-input"></div>' +
              '<button type="button" class="btn btn-secondary" id="promo-apply" style="background:var(--sand);white-space:nowrap;">Appliquer</button>' +
            '</div><p class="caution-note" id="promo-error" style="display:none;"></p>';

        var datesSummary = '<div class="dates-summary">' +
          '<div><strong>Retrait</strong>' + formatDate(retrait) + '</div>' +
          '<div><strong>Retour</strong>' + formatDate(retour) + '</div>' +
          (days ? '<div><strong>Durée</strong>' + days + ' jour' + (days > 1 ? "s" : "") + '</div>' : '') +
          '</div>';

        var slotsHtml = '<div class="contact-panel">' +
          '<h3>Créneaux horaires</h3>' +
          '<div class="field"><label>Créneau de retrait</label>' + slotDisplayHtml(retrait, "retrait") + '</div>' +
          '<div class="field" style="margin-bottom:0;"><label>Créneau de retour</label>' + slotDisplayHtml(retour, "retour") + '</div>' +
          '<p class="form-note" style="margin-top:10px;"><a href="index.html#dates" id="edit-dates-link">Modifier les dates ou créneaux</a></p>' +
          '</div>';

        content.innerHTML =
          '<h1>Votre panier</h1>' +
          '<p class="subtitle">Vérifiez votre matériel, vos dates et le montant de votre location avant de passer au paiement.</p>' +
          datesSummary +
          slotsHtml +
          itemsHtml +
          '<div class="cart-total"><span>Sous-total' + (tierIndex === null ? ' (estimation)' : '') + '</span><span>' + subtotal + ' €</span></div>' +
          promoLineHtml +
          (appliedPromo ? '<div class="cart-total"><span>Total</span><span>' + finalTotal + ' €</span></div>' : '') +
          '<p class="caution-note">Caution à prévoir au retrait : ' + totalCaution + ' €. Elle sera demandée séparément, par chèque ou autre moyen accepté. Elle n’est pas incluse dans le paiement en ligne.</p>' +
          '<div class="contact-panel">' +
            '<h3>Code promo</h3>' +
            promoBlockHtml +
          '</div>' +
          '<div class="contact-panel">' +
            '<h3>Vos coordonnées</h3>' +
            '<div class="field"><label for="client-nom">Nom et prénom *</label><input type="text" id="client-nom" placeholder="Votre nom et prénom" autocomplete="name" required></div>' +
            '<div class="field"><label for="client-email">Adresse e-mail *</label><input type="email" id="client-email" placeholder="vous@exemple.com" autocomplete="email" required></div>' +
            '<div class="field"><label for="client-phone">Téléphone *</label><input type="tel" id="client-phone" placeholder="Votre numéro de téléphone" autocomplete="tel" required></div>' +
            '<div class="field" style="margin-bottom:0;"><label for="client-message">Message (optionnel)</label><textarea id="client-message" rows="3" placeholder="Une précision concernant votre réservation..."></textarea></div>' +
            '<div class="field"><label>Vérification anti-robot</label><div id="turnstile-container"></div><p class="form-note" id="turnstile-status">Veuillez effectuer la vérification anti-robot.</p></div>' +
            '<div class="payment-info">Après la mise en service du paiement sécurisé Stancer, vous pourrez régler votre location par carte bancaire. Votre réservation sera confirmée automatiquement après validation effective du paiement.</div>' +
            '<button class="btn btn-primary send-btn" id="send-btn" type="button" disabled>Paiement en ligne bientôt disponible</button>' +
            '<p class="form-note">Aucun paiement ni aucune réservation ne sont effectués pour le moment. La caution sera réglée au retrait du matériel.</p>' +
          '</div>';

        turnstileToken = "";
        turnstileWidgetId = null;
        turnstileWaitCount = 0;
        waitForTurnstile();

        var editDatesLink = document.getElementById("edit-dates-link");
        if (editDatesLink){
          editDatesLink.addEventListener("click", function (e) {
            e.preventDefault();
            var params = new URLSearchParams();
            params.set("cart", JSON.stringify(lines));
            if (retrait) params.set("retrait", retrait);
            if (retour) params.set("retour", retour);
            if (selectedRetraitSlot) params.set("slotRetrait", selectedRetraitSlot);
            if (selectedRetourSlot) params.set("slotRetour", selectedRetourSlot);
            window.location.href = "index.html?" + params.toString() + "#dates";
          });
        }

        content.querySelectorAll("[data-qty]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            changeLineQty(parseInt(btn.getAttribute("data-index"), 10), parseInt(btn.getAttribute("data-qty"), 10));
          });
        });
        content.querySelectorAll("[data-remove]").forEach(function (btn) {
          btn.addEventListener("click", function () { removeLine(parseInt(btn.getAttribute("data-remove"), 10)); });
        });

        var promoApplyBtn = document.getElementById("promo-apply");
        if (promoApplyBtn){
          promoApplyBtn.addEventListener("click", function () {
            var result = findValidPromo(document.getElementById("promo-input").value || "");
            var errEl = document.getElementById("promo-error");
            if (result.error){
              errEl.textContent = result.error;
              errEl.style.display = "block";
            } else {
              appliedPromo = result.promo;
              render();
            }
          });
        }
        var promoRemoveBtn = document.getElementById("promo-remove");
        if (promoRemoveBtn){
          promoRemoveBtn.addEventListener("click", function () { appliedPromo = null; render(); });
        }

        // Création de la réservation puis ouverture du paiement sécurisé Stancer.
        var sendBtn = document.getElementById("send-btn");
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.textContent = "Payer ma réservation par carte";
          sendBtn.addEventListener("click", async function () {
            var statusEl = document.getElementById("reservation-status");
            if (statusEl) statusEl.textContent = "";
            if (appliedPromo) {
              if (statusEl) statusEl.textContent = "Les codes promo ne sont pas encore disponibles pour les réservations en ligne. Retirez le code promo pour continuer.";
              return;
            }
            if (!retrait || !retour || !selectedRetraitSlot || !selectedRetourSlot || !computeDays()) {
              if (statusEl) statusEl.textContent = "Vérifiez vos dates et vos créneaux de retrait et de retour.";
              return;
            }
            var nom = (document.getElementById("client-nom").value || "").trim();
            var email = (document.getElementById("client-email").value || "").trim();
            var telephone = (document.getElementById("client-phone").value || "").trim();
            if (!nom || !email || !telephone) {
              if (statusEl) statusEl.textContent = "Veuillez renseigner votre nom, votre e-mail et votre téléphone.";
              return;
            }
            if (!turnstileToken) {
              if (statusEl) statusEl.textContent = "Effectuez d'abord la vérification anti-robot.";
              return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = "Préparation du paiement...";
            try {
              var response = await supabaseClient.functions.invoke("create-reservation", {
                body: {
                  retrait: retrait,
                  retour: retour,
                  slotRetrait: selectedRetraitSlot,
                  slotRetour: selectedRetourSlot,
                  lines: lines,
                  client: { nom: nom, email: email, telephone: telephone },
                  turnstileToken: turnstileToken
                }
              });
              if (response.error) {
                var serverMessage = response.data && response.data.error
                  ? response.data.error
                  : "Impossible de créer la réservation. Vérifiez les informations et réessayez.";
                throw new Error(serverMessage);
              }
              var result = response.data;
              if (!result || result.success !== true || !result.reservation || !result.reservation.reservation_id) {
                throw new Error("La réponse du serveur est incomplète. Contactez Maloé Location avant de recommencer.");
              }

              var reservationId = result.reservation.reservation_id;
              sendBtn.textContent = "Ouverture de la page de paiement...";
              var paymentResponse = await supabaseClient.functions.invoke("stancer-payment", {
                body: { action: "create", reservation_id: reservationId }
              });
              if (paymentResponse.error || !paymentResponse.data || paymentResponse.data.success !== true ||
                  typeof paymentResponse.data.payment_url !== "string" ||
                  !paymentResponse.data.payment_url.startsWith("https://payment.stancer.com/")) {
                var paymentMessage = paymentResponse.data && paymentResponse.data.error
                  ? paymentResponse.data.error
                  : "La page de paiement n'a pas pu être préparée.";
                content.innerHTML =
                  '<div class="contact-panel"><h1>Réservation créée, paiement à terminer</h1>' +
                  '<p>Votre réservation est temporairement en attente. Aucun encaissement n’est confirmé.</p>' +
                  '<p><strong>Référence :</strong> ' + reservationId + '</p>' +
                  '<p>' + paymentMessage + '</p>' +
                  '<p class="caution-note">Ne créez pas une deuxième réservation pour le même panier. Si besoin, contactez Maloé Location en indiquant cette référence.</p>' +
                  '<a class="btn btn-primary" href="index.html">Retour au site</a></div>';
                return;
              }
              window.location.assign(paymentResponse.data.payment_url);
            } catch (error) {
              if (statusEl) statusEl.textContent = error && error.message ? error.message : "Une erreur est survenue. Réessayez.";
              turnstileToken = "";
              if (window.turnstile && turnstileWidgetId !== null) {
                window.turnstile.reset(turnstileWidgetId);
              }
              sendBtn.disabled = false;
              sendBtn.textContent = "Payer ma réservation par carte";
            }
          });
        }
        var statusContainer = document.createElement("p");
        statusContainer.id = "reservation-status";
        statusContainer.className = "form-note";
        statusContainer.setAttribute("role", "status");
        if (sendBtn && sendBtn.parentNode) sendBtn.parentNode.insertBefore(statusContainer, sendBtn.nextSibling);

      }

      render();
    })
    .catch(function () {
      document.getElementById("content").innerHTML = '<p style="color:var(--coral);">Impossible de charger le panier pour le moment.</p>';
    });
</script>
</body>
</html>
